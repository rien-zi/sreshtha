server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;

    # SPA fallback — every unknown route serves index.html so React Router owns navigation.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # FastAPI passthrough — the SPA always calls its own origin. The official
    # nginx image renders this file from a template at startup, replacing
    # API_UPSTREAM with either http://app:8000 (Compose) or the Cloud Run API
    # service URL.
    location /api/  { proxy_pass ${API_UPSTREAM}; include /etc/nginx/proxy_params.conf; }
    location /auth/ { proxy_pass ${API_UPSTREAM}; include /etc/nginx/proxy_params.conf; }
    location /run   { proxy_pass ${API_UPSTREAM}; include /etc/nginx/proxy_params.conf; }
    location /ping  { proxy_pass ${API_UPSTREAM}; include /etc/nginx/proxy_params.conf; }
}
